[project]
name = "mk-pptx"
version = "0.1.0"
description = "AI 輔助企業簡報自動化工具"
requires-python = ">=3.13"
dependencies = [
    "python-pptx==1.0.2",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
azure = ["openai>=1.0"]
all = ["google-genai>=1.0", "openai>=1.0"]
dev = [
    "pytest>=8.0",
    "pip-audit",
]

[project.scripts]
mk-pptx = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
